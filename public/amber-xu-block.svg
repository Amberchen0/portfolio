<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100" preserveAspectRatio="xMidYMid meet">
  <!-- "AMBER" / "XU" stacked over two lines — Vogue-masthead /
       fashion-editorial layout. ViewBox bumped from 950 → 1100 for
       more vertical breathing room so the block doesn't read as
       squashed flat. XU sits 97 viewBox units below previous
       baseline (≈ 50 screen px @ container scale 0.514).
       Fallback chain: Didot → Bodoni 72 → GFS Didot → Hoefler Text →
       Times New Roman → generic serif. -->
  <text x="700" y="420"
        text-anchor="middle"
        font-family="'Didot', 'Bodoni 72', 'GFS Didot', 'Hoefler Text', 'Times New Roman', serif"
        font-weight="bold"
        font-size="360"
        letter-spacing="8"
        fill="#000000">AMBER</text>
  <text x="700" y="987"
        text-anchor="middle"
        font-family="'Didot', 'Bodoni 72', 'GFS Didot', 'Hoefler Text', 'Times New Roman', serif"
        font-weight="bold"
        font-size="500"
        letter-spacing="8"
        fill="#000000">XU</text>
</svg>
